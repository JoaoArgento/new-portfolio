<div class="new-projects">
  <span class="circle"></span>
  Disponivel para novos projetos
</div>

<div class="presentation">
  <h1 class="name">João Pedro Argento Garcia</h1>
  <p class="presentation-text">
    Desenvolvedor Fullstack | .NET | C# | APIs REST | SQL | Angular | RxJS
  </p>
</div>

<div class="stacks">
  @for (technology of technologies; track technology.name) {
    <div class="technology">
      <ng-icon [name]="technology.iconName" />
      <span class="technology-name">{{ technology.name }}</span>
    </div>
    @if ($index < technologies.length - 1) {
      <div class="separator"></div>
    }
  }
</div>

<div class="button-group">
  <button class="cv-button">
    <span>Baixar curriculo</span>
    <ng-icon name="bootstrapArrowDown"></ng-icon>
  </button>
  <button class="about-button">
    <ng-icon name="bootstrapInfoCircle"></ng-icon>
    <span>Sobre mim</span>
  </button>
